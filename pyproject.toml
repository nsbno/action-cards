[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "action_cards"
version = "0.0.1"
description = "A project to explore action cards data and apply AI for it."
authors = [
  { name = "VyAI-team" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "anthropic>=1.9.0",
    "awscli",
    "black",
    "flake8",
    "ipykernel>=7.3.0",
    "isort",
    "loguru",
    "openai>=3.20.0",
    "pip",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv",
    "tqdm",
    "typer",
]
requires-python = "~=3.14.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["action_cards"]
force_sort_within_sections = true


